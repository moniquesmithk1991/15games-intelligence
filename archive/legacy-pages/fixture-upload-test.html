<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15GAMES Fixture Upload Test</title><style>body{background:#0b1220;color:#eef4ff;font:16px system-ui;max-width:960px;margin:30px auto;padding:16px}section{background:#172238;border:1px solid #35445d;border-radius:12px;padding:20px}input,button,textarea{font:inherit;padding:12px;margin:8px 0}input{display:block;background:white;color:#111;width:95%;box-sizing:border-box}button{background:#2876dc;color:white;border:0;border-radius:7px;cursor:pointer}textarea{width:95%;height:130px;background:#fff;color:#111}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px;border-bottom:1px solid #35445d;text-align:left}#status{font-weight:bold;color:#9ee7ad}.scroll{overflow:auto}</style></head><body><h1>15GAMES · Fixture Upload</h1><p>Independent CSV upload test. This page reads files directly on your device and shows whether the fixtures were imported.</p><section><label for="file"><strong>1. Choose upcoming fixtures CSV</strong></label><input id="file" type="file" accept=".csv,text/csv,text/plain"><button id="try" type="button">Read selected file</button><p id="status" role="status">Waiting for a CSV file.</p><details><summary>Alternative: paste CSV text instead</summary><textarea id="paste" placeholder="date,league,home,away"></textarea><button id="pasteBtn">Import pasted CSV</button></details><p id="summary"></p><div class="scroll"><table><thead><tr><th>Date</th><th>Country</th><th>League</th><th>Home</th><th>Away</th></tr></thead><tbody id="rows"></tbody></table></div></section><p><a style="color:#9dc7ff" href="./index.html">Back to main dashboard</a></p><script>
const el=id=>document.getElementById(id);
function splitCSV(line){let out=[],cur='',quoted=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
function importCSV(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)throw Error('The file is empty');const head=splitCSV(lines.shift()).map(x=>x.trim().toLowerCase());const idx=Object.fromEntries(head.map((x,i)=>[x,i]));for(const k of ['date','home','away'])if(idx[k]===undefined)throw Error('Missing column: '+k+' (found: '+head.join(', ')+')');const get=(r,k)=>idx[k]===undefined?'':String(r[idx[k]]||'').trim();let rows=[],bad=0;for(const line of lines){const r=splitCSV(line);const f={date:get(r,'date'),country:get(r,'country'),league:get(r,'league'),home:get(r,'home'),away:get(r,'away')};if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date)||!f.home||!f.away){bad++;continue}rows.push(f)}el('rows').innerHTML='';for(const f of rows.slice(0,250)){const tr=document.createElement('tr');for(const k of ['date','country','league','home','away']){const td=document.createElement('td');td.textContent=f[k];tr.appendChild(td)}el('rows').appendChild(tr)}el('summary').textContent=rows.length+' valid fixtures; '+bad+' skipped. Showing first '+Math.min(rows.length,250)+'.';el('status').textContent=rows.length?'Success: CSV imported.':'No valid fixtures found.'}
async function read(){const f=el('file').files[0];if(!f){el('status').textContent='No file selected — click Choose File above.';return}el('status').textContent='Reading '+f.name+' ('+f.size+' bytes)…';try{const text=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||''));reader.onerror=()=>reject(reader.error||Error('File read failed'));reader.readAsText(f)});importCSV(text)}catch(e){el('status').textContent='ERROR: '+e.message}}
el('file').addEventListener('change',()=>{const f=el('file').files[0];el('status').textContent=f?'Selected: '+f.name+'. Click Read selected file.':'No file selected.'});el('try').addEventListener('click',read);el('pasteBtn').addEventListener('click',()=>{try{importCSV(el('paste').value)}catch(e){el('status').textContent='ERROR: '+e.message}});window.addEventListener('error',e=>{el('status').textContent='Page error: '+e.message});
</script></body></html>
