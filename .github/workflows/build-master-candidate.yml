name: 15GAMES build guarded master candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Recheck official Japan results
        run: python scripts/recover_japan_official.py
      - name: Re-run preflight
        run: python scripts/preflight_season_merge.py
      - name: Build master candidate with hash guard
        run: python scripts/build_master_candidate.py
      - name: Upload candidate and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 15games-master-candidate-239614
          path: |
            data/merge_review/historical_matches_candidate_239614.csv
            data/merge_review/promotion_summary.json
          if-no-files-found: warn
          retention-days: 30
