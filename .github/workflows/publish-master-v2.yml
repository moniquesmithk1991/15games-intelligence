name: 15GAMES publish validated master v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-master-v2-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Japan source parser
        run: python -m pip install beautifulsoup4
      - name: Rebuild Japan official review
        run: python scripts/recover_japan_official.py
      - name: Recheck additions against original master
        run: python scripts/preflight_season_merge.py
      - name: Build SHA-guarded master candidate
        run: python scripts/build_master_candidate.py
      - name: Publish separate versioned master (original unchanged)
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, shutil
          root=pathlib.Path('.')
          report=json.loads((root/'data/merge_review/promotion_summary.json').read_text())
          source=root/'data/merge_review/historical_matches_candidate_239614.csv'
          target=root/'historical_matches_v2_239614.csv'
          if target.exists():
              raise SystemExit('Versioned master already exists: refusing overwrite')
          if report['candidate_rows']!=239614 or report['added_rows']!=760:
              raise SystemExit('Unexpected row counts')
          if hashlib.sha256(source.read_bytes()).hexdigest()!=report['candidate_sha256']:
              raise SystemExit('Candidate checksum mismatch')
          shutil.copyfile(source,target)
          print('Versioned master created:',target)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical_matches_v2_239614.csv
          git commit -m "Publish validated historical master v2 with 239614 matches"
          git push
      - name: Upload validation manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 15games-master-v2-publication-report
          path: data/merge_review/promotion_summary.json
          if-no-files-found: warn
