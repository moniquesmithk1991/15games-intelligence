name: South America scoreboard refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Argentina and Brazil matches
        run: python scripts/update_south_america.py
      - name: Commit refreshed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/south_america_matches.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh South America match results"
            git push
          fi
