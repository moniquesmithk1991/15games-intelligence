name: 15GAMES Japan official results recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4
      - name: Cross-check Japan J1 2025 with official results
        run: python scripts/recover_japan_official.py
      - name: Upload review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 15games-japan-official-review
          path: data/japan_official_review/
          if-no-files-found: warn
          retention-days: 30
