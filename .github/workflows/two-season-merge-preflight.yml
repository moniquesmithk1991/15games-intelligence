name: 15GAMES two-season merge preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Rebuild and verify official Japan 2025 results
        run: python scripts/recover_japan_official.py
      - name: Compare complete seasons to master (read-only)
        run: python scripts/preflight_season_merge.py
      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 15games-two-season-merge-preflight
          path: data/merge_review/
          if-no-files-found: warn
          retention-days: 30
