name: 15GAMES historical staging audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/staging/*.csv'
      - 'historical_matches.csv'
      - 'scripts/audit_staging.py'
      - '.github/workflows/historical-staging-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit staged results against master
        run: python scripts/audit_staging.py
      - name: Upload review reports
        uses: actions/upload-artifact@v4
        with:
          name: 15games-staging-audit
          path: data/audit/
          retention-days: 30
